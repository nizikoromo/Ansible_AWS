- name: Download mysql repo
  ansible.builtin.dnf:
    name: https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
    state: present

- name: Install mysql-community-client
  ansible.builtin.dnf:
    name: mysql-community-client
    state: present

- name: Copy log-processor
  ansible.builtin.copy:
    src: ../files/log-processor
    dest: "{{ dest_path['log_processor'] }}"

- name: Copy web
  ansible.builtin.copy:
    src: ../files/web
    dest: "{{ dest_path['web'] }}"

- name: Grant execution permission to log-processor
  ansible.builtin.file:
    path: "{{ dest_path['log_processor'] }}"
    mode: "0755"

- name: Grant execution permission to web
  ansible.builtin.file:
    path: "{{ dest_path['web'] }}"
    mode: "0755"

- name: Run the log-processor in the background
  ansible.builtin.shell: "nohup {{ dest_path['log_processor'] }} > /dev/null 2>&1 &"

- name: Run the web in the background
  ansible.builtin.shell: "nohup {{ dest_path['web'] }} > /dev/null 2>&1 &"