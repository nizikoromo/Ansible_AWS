- name: Ensure Go is installed
  ansible.builtin.yum:
    name: golang
    state: present

# --- 1. log-processor のコピーとビルド ---
- name: Copy log-processor source to remote temp
  ansible.builtin.copy:
    src: log-processor
    dest: /tmp/

- name: Build log-processor binary
  ansible.builtin.command:
    cmd: go build -o {{ dest_path['log_processor'] }} main.go
    chdir: /tmp/log-processor

# --- 2. web のコピーとビルド ---
- name: Copy web source to remote temp
  ansible.builtin.copy:
    src: web
    dest: /tmp/

- name: Build web binary
  ansible.builtin.command:
    cmd: go build -o {{ dest_path['web'] }} main.go
    chdir: /tmp/web

# --- 3. パーミッション付与（実行権限） ---
- name: Grant execution permission to log-processor
  ansible.builtin.file:
    path: "{{ dest_path['log_processor'] }}"
    mode: "0755"

- name: Grant execution permission to web
  ansible.builtin.file:
    path: "{{ dest_path['web'] }}"
    mode: "0755"

# --- 4. バックグラウンド起動（DB_DSNの動的設定を含む） ---
- name: Run the log-processor in the background
  ansible.builtin.shell: >
    export DB_DSN="admin:{{ lookup('file', '../vars/terraform_outputs.json').db_password.value }}@tcp({{ lookup('file', '../vars/terraform_outputs.json').rds_endpoint.value }})/terrafomr_db?parseTime=true" &&
    nohup {{ dest_path['log_processor'] }} > /dev/null 2>&1 &
  args:
    executable: /bin/bash

- name: Run the web app in the background
  ansible.builtin.shell: >
    export DB_DSN="admin:{{ lookup('file', '../vars/terraform_outputs.json').db_password.value }}@tcp({{ lookup('file', '../vars/terraform_outputs.json').rds_endpoint.value }})/terrafomr_db?parseTime=true" &&
    nohup {{ dest_path['web'] }} > /dev/null 2>&1 &
  args:
    executable: /bin/bash